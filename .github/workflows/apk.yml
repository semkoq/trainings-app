name: APK bauen

on:
  push:
    branches: [main]
    paths: ['android-src/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Android-Projekt erzeugen
        working-directory: android-src
        env: { RUN: '${{ github.run_number }}' }
        run: |
          npm install --no-audit --no-fund
          mkdir -p www && echo '<!doctype html><title>Trainings-App</title>' > www/index.html
          npx cap add android
          python3 patch.py
          npx cap sync android
      - name: APK bauen
        working-directory: android-src/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: APK signieren
        env:
          KP: ${{ secrets.KEYSTORE_PASS }}
        run: |
          test -n "$KP" || { echo "::error::Secret KEYSTORE_PASS fehlt"; exit 1; }
          cp android-src/signing/trainingsapp.jks ks.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android-src/android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          $BT/apksigner sign --ks ks.jks --ks-pass pass:$KP --ks-key-alias trainingsapp --key-pass pass:$KP --out trainings-app.apk aligned.apk
          $BT/apksigner verify trainings-app.apk
          rm ks.jks
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Trainings-App 1.${{ github.run_number }}
          body: Neue APK-Version 1.${{ github.run_number }}. Auf dem Handy öffnen und installieren.
          make_latest: true
          files: trainings-app.apk
